# Using tools, show all results of testing to a file.
save_result:
    stage: save_result
    script:
        - echo "Save Results"
        - docker exec -i hecate_ci_container bash -c "python3 hecate-compiler/script/ci_result.py /home/gitlab-runner/results"
    tags:
        - hestia_runner
    dependencies:
        - Hecate build
    rules:
        - if: "$CI_COMMIT_BRANCH == 'main' && $CI_PIPELINE_SOURCE == 'schedule' && ($SCHEDULE_TYPE == 'weekly' || $SCHEDULE_TYPE == 'irregularly')"
          when: always

