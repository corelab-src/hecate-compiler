# Using tools, show all results of testing to a file.
save_result:
    stage: save_result
    script:
        - echo "Save Results"
        - docker exec -i -u ${CI_USER} hecate_ci_container bash -c "python3 ${CI_DOCKER_HOME}/hecate-compiler/script/ci_result.py ${CI_RESULTS_DIR}"
    tags:
        - hestia_runner
    dependencies:
        - Hecate build
    rules:
        - if: "$CI_COMMIT_BRANCH == 'main' && $CI_PIPELINE_SOURCE == 'schedule' && ($SCHEDULE_TYPE == 'weekly' || $SCHEDULE_TYPE == 'irregularly')"
          when: always


